<!DOCTYPE html>
<html lang="en">
<head>
<base href="/table/">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#07061A">
<meta name="color-scheme" content="dark">
<meta name="description" content="Our table's Daggerheart books, searchable on your phone.">
<title>Daggerheart Resources — High Sodium Gaming</title>
<link rel="icon" href="/icon.png" type="image/png">
<meta name="robots" content="noindex, nofollow">
<style>
/* typefaces ship with the page (SIL Open Font License) so nothing loads from elsewhere */
@font-face { font-family: Cinzel; font-weight: 700; font-display: swap; src: url(fonts/cinzel-latin-700-normal.woff2) format("woff2"); }
@font-face { font-family: Cinzel; font-weight: 900; font-display: swap; src: url(fonts/cinzel-latin-900-normal.woff2) format("woff2"); }
@font-face { font-family: "Space Grotesk"; font-weight: 400; font-display: swap; src: url(fonts/space-grotesk-latin-400-normal.woff2) format("woff2"); }
@font-face { font-family: "Space Grotesk"; font-weight: 500; font-display: swap; src: url(fonts/space-grotesk-latin-500-normal.woff2) format("woff2"); }
@font-face { font-family: "Space Grotesk"; font-weight: 700; font-display: swap; src: url(fonts/space-grotesk-latin-700-normal.woff2) format("woff2"); }
@font-face { font-family: Caveat; font-weight: 600; font-display: swap; src: url(fonts/caveat-latin-600-normal.woff2) format("woff2"); }
@font-face { font-family: Caveat; font-weight: 700; font-display: swap; src: url(fonts/caveat-latin-700-normal.woff2) format("woff2"); }
:root {
  color-scheme: dark;
  --night: #07061a;
  --ink: #efe8d6;
  --dim: rgba(239, 232, 214, .64);
  --gold: #e7c77c;
  --fear: #b99cff;
  --panel: rgba(9, 8, 28, .82);
  --line: rgba(231, 199, 124, .34);
  --line-hot: rgba(231, 199, 124, .7);
  --shade: rgba(0, 0, 0, .55);
  /* command bar: --kb is set by js/command.js to the height an on-screen keyboard covers */
  --bar-h: 48px;
  --bar-w: 560px;
  --bar-inset: 12px;
  --bar-bottom: max(18px, env(safe-area-inset-bottom));
  --kb: 0px;
  --gold-hi: #f6dc94;
  --gold-lo: #c9973c;
  --on-gold: #1b1203;
  --row-bg: rgba(9, 8, 28, .8);
  --fear-line: rgba(185, 156, 255, .42);
  --crit-ink: #fff3d2;
  --crit-bg: rgba(48, 34, 8, .86);
  --crit-line: rgba(255, 214, 130, .85);
  --crit-glow: rgba(255, 200, 90, .9);
  --serif: Cinzel, "Trajan Pro", Georgia, serif;
  --sans: "Space Grotesk", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --hand: Caveat, "Segoe Script", "Bradley Hand", cursive;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--night); color: var(--ink); font: 15px/1.45 var(--sans); overflow: hidden; }
a { color: inherit; }

/* ------------------------------------------------------------ the stage */
#gl { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; outline: none; cursor: grab; -webkit-tap-highlight-color: transparent; }
#gl.is-drag { cursor: grabbing; }
#gl.is-hot { cursor: pointer; }
body.is-open #gl { cursor: default; }
body.is-open #gl.is-hot { cursor: pointer; }

/* ------------------------------------------------------------ chrome over the stage */
.hud { position: fixed; z-index: 3; opacity: 0; transition: opacity .9s ease; }
body.is-ready .hud { opacity: 1; }
body.is-open .hud.hide-open, body.is-leaving .hud { opacity: 0; pointer-events: none; }

#home { left: max(20px, env(safe-area-inset-left)); top: max(18px, env(safe-area-inset-top)); display: inline-flex; align-items: center; gap: .55em;
  font: 500 13px/1 var(--sans); letter-spacing: .04em; color: var(--dim); text-decoration: none; padding: 10px 12px; margin: -10px -12px; border-radius: 999px; }
#home:hover { color: var(--ink); }
#home svg { width: 14px; height: 14px; }

#hint { left: 50%; bottom: calc(var(--bar-bottom) + var(--bar-h) + 16px); transform: translateX(-50%); margin: 0; white-space: nowrap; pointer-events: none;
  font: 500 13px/1 var(--sans); letter-spacing: .06em; color: var(--dim); text-shadow: 0 1px 8px rgba(0, 0, 0, .8); transition-delay: 1.6s; }
#hint b { color: var(--gold); font-weight: 500; }
body.has-touched #hint { opacity: 0; transition-delay: 0s; }

#mode { right: max(18px, env(safe-area-inset-right)); bottom: max(18px, env(safe-area-inset-bottom)); margin: 0; pointer-events: none;
  font: 500 11px/1 var(--sans); letter-spacing: .08em; text-transform: uppercase; color: rgba(239, 232, 214, .34); }

/* command bar: chat-style dice commands */
#cmd { left: 50%; bottom: calc(var(--bar-bottom) + var(--kb)); transform: translateX(-50%); width: min(var(--bar-w), calc(100vw - var(--bar-inset) * 2)); height: var(--bar-h); margin: 0;
  display: flex; align-items: center; gap: 6px; padding: 4px 4px 4px 18px; border-radius: 999px; background: var(--panel); border: 1px solid var(--line);
  box-shadow: 0 18px 50px var(--shade); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); transition: opacity .9s ease, border-color .2s ease; }
#cmd:focus-within { border-color: var(--line-hot); }
#cmd:has(input:focus-visible) { outline: 2px solid var(--gold); outline-offset: 3px; }
#cmd input { flex: 1; min-width: 0; height: 100%; padding: 0; border: 0; outline: none; background: none; color: var(--ink); font: 500 16px/1 var(--sans); letter-spacing: .02em; }
#cmd input::placeholder { color: var(--dim); }
#cmd button { appearance: none; flex: none; height: 100%; min-width: 64px; padding: 0 18px; border: 0; border-radius: 999px; cursor: pointer;
  background: linear-gradient(var(--gold-hi), var(--gold-lo)); color: var(--on-gold); font: 700 12px/1 var(--sans); letter-spacing: .14em; text-transform: uppercase; }
#cmd button:hover { filter: brightness(1.08); }
#cmd button:active { transform: scale(.97); }
#cmd button:focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; }
body.is-open #cmd, body.is-leaving #cmd { visibility: hidden; }

/* floating plate that names the book under the pointer */
#plate { position: fixed; z-index: 4; left: 0; top: 0; width: max-content; max-width: min(270px, 76vw); pointer-events: none; opacity: 0;
  transition: opacity .22s ease; will-change: transform, opacity; text-align: center; }
#plate.on { opacity: 1; }
#plate .box { padding: 12px 16px 13px; border-radius: 14px; background: rgba(9, 8, 28, .82); border: 1px solid rgba(231, 199, 124, .34);
  box-shadow: 0 18px 50px rgba(0, 0, 0, .55), inset 0 0 0 1px rgba(255, 255, 255, .03); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
#plate h2 { margin: 0 0 5px; font: 700 16px/1.15 var(--serif); letter-spacing: .02em; color: #fff3d2; text-wrap: balance; }
#plate p { margin: 0; }
#plate .sub { color: var(--dim); font-size: 12.5px; line-height: 1.35; text-wrap: pretty; }
#plate .meta { margin-top: 8px; color: rgba(239, 232, 214, .5); font-size: 12px; font-variant-numeric: tabular-nums; }
#plate .pill { display: inline-block; margin-top: 11px; padding: 6px 15px; border-radius: 999px; border: 1px solid rgba(231, 199, 124, .6);
  font: 700 11px/1 var(--sans); letter-spacing: .18em; text-transform: uppercase; color: var(--gold); }

/* shown once a book lies open, wherever the page cannot navigate by itself */
#enter { position: fixed; z-index: 5; left: 50%; bottom: max(38px, env(safe-area-inset-bottom)); transform: translate(-50%, 14px); display: flex; flex-direction: column; align-items: center; gap: 12px;
  opacity: 0; pointer-events: none; transition: opacity .5s ease, transform .5s ease; }
#enter.on { opacity: 1; transform: translate(-50%, 0); pointer-events: auto; }
#enter a { display: inline-flex; align-items: center; gap: .6em; min-height: 50px; padding: 0 28px; border-radius: 999px; text-decoration: none; white-space: nowrap;
  background: linear-gradient(var(--gold-hi), var(--gold-lo)); color: var(--on-gold); font: 700 14px/1 var(--sans); letter-spacing: .12em; text-transform: uppercase;
  box-shadow: 0 10px 40px rgba(240, 190, 90, .35), inset 0 1px 0 rgba(255, 255, 255, .6); transition: transform .15s ease, filter .15s ease; }
#enter a:hover { filter: brightness(1.08); }
#enter a:active { transform: scale(.97); }
#enter button { appearance: none; border: 0; background: none; color: var(--ink); text-shadow: 0 1px 10px rgba(0, 0, 0, .9); font: 500 13px/1 var(--sans); letter-spacing: .05em; padding: 10px 14px; border-radius: 999px; cursor: pointer; }
#enter button:hover { color: #fff; }

:is(#home, #enter a, #enter button):focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; }

#load { position: fixed; z-index: 6; inset: 0; display: grid; place-items: center; background: var(--night); transition: opacity .9s ease; }
#load p { margin: 0; font: 700 13px/1 var(--serif); letter-spacing: .34em; text-transform: uppercase; color: rgba(231, 199, 124, .8); animation: breathe 1.8s ease-in-out infinite; }
body.is-ready #load { opacity: 0; pointer-events: none; }
@keyframes breathe { 50% { opacity: .35; } }

/* plain page for browsers with no WebGL at all */
#plain { display: none; position: fixed; inset: 0; z-index: 7; overflow: auto; padding: 12vh 24px 48px; background: var(--night); text-align: center; }
body.no-gl #plain { display: block; }
body.no-gl #gl, body.no-gl .hud, body.no-gl #load { display: none; }
#plain h1 { margin: 0 0 32px; font: 900 clamp(30px, 7vw, 56px)/1.05 var(--serif); }
#plain a.card { display: block; max-width: 440px; margin: 0 auto 16px; padding: 22px 24px; border-radius: 16px; border: 1px solid rgba(231, 199, 124, .3); text-decoration: none; text-align: left; }
#plain a.card strong { display: block; font: 700 20px/1.2 var(--serif); margin-bottom: 6px; }
#plain a.card span { color: var(--dim); font-size: 14px; }

.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }

/* ------------------------------------------------------------ live HTML that is drawn onto things on the table
   These elements are children of the <canvas>. With HTML-in-Canvas they are
   painted into textures every time they change; elsewhere they are only read
   by assistive tech and the keyboard. Sizes are in px and match surfaces.js. */
.surf { position: absolute; left: 0; top: 0; margin: 0; overflow: hidden; display: block; pointer-events: none; outline: none; text-decoration: none;
  background-size: 100% 100%; color: #f3deaa; font-family: var(--sans); -webkit-font-smoothing: antialiased; contain: strict; }
.surf * { margin: 0; }
.gold { background: linear-gradient(#fff6cf 0%, #f0cc74 30%, #b98532 56%, #f7dc92 74%, #a8742a 100%); -webkit-background-clip: text; background-clip: text; color: transparent; }

/* covers */
.cover .cv-kicker, .cover .cv-name, .cover .cv-house { position: absolute; left: 0; right: 0; text-align: center; text-transform: uppercase; white-space: nowrap; }
.cover .cv-kicker, .cover .cv-name { background: linear-gradient(#fff6cf 0%, #f0cc74 30%, #b98532 56%, #f7dc92 74%, #a8742a 100%); -webkit-background-clip: text; background-clip: text; color: transparent;
  filter: drop-shadow(0 3px 3px rgba(0, 0, 0, .55)); }
.cover .cv-kicker { top: 11.5%; font: 900 68px/1 var(--serif); letter-spacing: 4px; }
.cover .cv-name { top: 79.6%; font: 700 46px/1 var(--serif); letter-spacing: 6px; }
.cover .cv-house { top: 88.9%; font: 500 17px/1 var(--sans); letter-spacing: 5px; color: rgba(243, 222, 170, .75); }
.cover .cv-sheen { position: absolute; inset: 0; opacity: 0; mix-blend-mode: screen;
  background: linear-gradient(112deg, transparent 38%, rgba(255, 236, 190, .1) 44%, rgba(255, 244, 214, .55) 50%, rgba(255, 236, 190, .1) 56%, transparent 62%) no-repeat; background-size: 260% 100%; background-position: 130% 0; }
.cover.is-hot .cv-sheen { opacity: 1; animation: sheen 1.7s cubic-bezier(.3, 0, .2, 1) infinite; }
.cover.is-hot .cv-kicker, .cover.is-hot .cv-name { filter: drop-shadow(0 0 14px rgba(255, 214, 130, .75)) brightness(1.18); }
@keyframes sheen { from { background-position: 130% 0; } to { background-position: -30% 0; } }

/* opened pages */
.spread .sp-plate { position: absolute; left: 20%; top: 32%; width: 60%; height: 32%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; color: #1c1408; text-align: center; }
.spread .sp-plate em { font: italic 500 22px/1 Georgia, serif; color: #3d2e12; }
.spread .sp-plate strong { font: 700 30px/1.25 var(--serif); letter-spacing: 3px; text-transform: uppercase; width: 78%; }
.spread .sp-rule { display: block; width: 46%; height: 2px; flex: none; background: linear-gradient(90deg, transparent, #9a7634 18%, #9a7634 82%, transparent); }
.spread .sp-title { position: absolute; inset: 9% 13% 8%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; text-align: center; color: #23180c; }
.spread .sp-kicker { font: 700 26px/1 var(--serif); letter-spacing: 9px; text-transform: uppercase; color: #7a5a26; }
.spread .sp-name { font: 900 66px/1.1 var(--serif); letter-spacing: 2px; text-transform: uppercase; }
.spread .sp-name .w { display: inline-block; white-space: nowrap; }
.spread .sp-name .w span { display: inline-block; }
.spread .sp-sub { font: 500 22px/1.42 var(--sans); color: #33261a; text-wrap: balance; }
.spread .sp-meta { font: 700 16px/1 var(--sans); letter-spacing: 3px; text-transform: uppercase; color: #6a4c18; }
.spread .sp-go { font: italic 500 21px/1 Georgia, serif; color: #54401c; }
/* the title writes itself in as the cover lifts */
.spread-right .sp-name .w span { opacity: 0; transform: translateY(14px) scale(1.08); filter: blur(6px); }
.spread-right.is-open .sp-name .w span { opacity: 1; transform: none; filter: none; transition: opacity .5s ease, transform .6s cubic-bezier(.2, .8, .2, 1), filter .5s ease; transition-delay: calc(.25s + var(--i) * 45ms); }
.spread-right :is(.sp-kicker, .sp-rule, .sp-sub, .sp-meta, .sp-go) { opacity: 0; }
.spread-right.is-open :is(.sp-kicker, .sp-rule, .sp-sub, .sp-meta, .sp-go) { opacity: 1; transition: opacity .7s ease .15s; }
.spread-right.is-open :is(.sp-sub, .sp-meta) { transition-delay: .85s; }
.spread-right.is-open .sp-go { transition-delay: 1.2s; animation: breathe 1.6s ease-in-out 2s infinite; }

/* GM screen */
.gm { text-align: center; }
.gm .gm-house { position: absolute; left: 0; right: 0; top: 19.5%; font: 500 24px/1 var(--sans); letter-spacing: 10px; text-transform: uppercase; color: rgba(232, 214, 170, .8); }
.gm .gm-title { position: absolute; left: 0; right: 0; top: 29%; font-family: var(--serif); text-transform: uppercase; filter: drop-shadow(0 4px 5px rgba(0, 0, 0, .6)); }
.gm .gm-title span { display: block; -webkit-background-clip: text; background-clip: text; color: transparent; background-repeat: no-repeat;
  background-image: linear-gradient(112deg, transparent 43%, rgba(255, 255, 255, .95) 50%, transparent 57%), linear-gradient(#fff6cf 0%, #f0cc74 30%, #b98532 56%, #f7dc92 74%, #a8742a 100%);
  background-size: 300% 100%, 100% 100%; background-position: 100% 0, 0 0; animation: glint 9s ease-in-out infinite; }
.gm .gm-a { font-weight: 900; font-size: 148px; line-height: 1.02; letter-spacing: 4px; }
.gm .gm-b { font-weight: 700; font-size: 90px; line-height: 1.24; letter-spacing: 26px; margin-right: -26px; }
@keyframes glint { 0%, 68% { background-position: 100% 0, 0 0; } 100% { background-position: 0% 0, 0 0; } }
.gm .gm-rule { position: absolute; left: 33%; right: 33%; top: 74.2%; height: 2px; background: linear-gradient(90deg, transparent, #d9b565 20%, #d9b565 80%, transparent); }
.gm .gm-tag { position: absolute; left: 0; right: 0; top: 79.5%; font: italic 500 26px/1 Georgia, serif; color: rgba(232, 214, 170, .78); }

/* the note */
.note { color: #2a2140; font-family: var(--hand); padding: 54px 44px 0 50px; }
.note .nt-a { font-weight: 700; font-size: 50px; line-height: 62px; text-wrap: balance; }
.note .nt-b { font-weight: 600; font-size: 36px; margin-top: 34px; color: #7a3a2a; }

/* the roll log (screen-space; drawn by js/command.js, painted twin in surfaces.js) */
.rolllog { display: flex; flex-direction: column; justify-content: flex-end; align-items: center; gap: 2px; }
.rolllog .lg-row { display: flex; align-items: center; gap: 12px; height: 32px; margin: 3px 0; max-width: calc(100% - 4px); padding: 0 16px; border-radius: 15px; overflow: hidden; white-space: nowrap;
  background: var(--row-bg); border: 1px solid var(--line); color: var(--ink); }
.rolllog .lg-row::before { content: ""; flex: none; width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
.rolllog .lg-row b { font: 700 17px/1 var(--sans); }
.rolllog .lg-row span { font: 500 13px/1 var(--sans); color: var(--dim); }
.rolllog .lg-hope { color: var(--gold); }
.rolllog .lg-fear { color: var(--fear); border-color: var(--fear-line); }
.rolllog .lg-critical { color: var(--crit-ink); background: var(--crit-bg); border-color: var(--crit-line); }
.rolllog .lg-critical b { text-shadow: 0 0 10px var(--crit-glow); }
.rolllog .lg-hint { color: var(--dim); }
.rolllog .lg-hint::before { display: none; }

@media (prefers-reduced-motion: reduce) {
  .hud, #load, #plate, #enter, #cmd { transition: none; }
  .cover.is-hot .cv-sheen, .gm .gm-title span, #load p { animation: none; }
  .spread-right .sp-name .w span, .spread-right :is(.sp-kicker, .sp-rule, .sp-sub, .sp-meta, .sp-go) { opacity: 1; transform: none; filter: none; transition: none; }
}
@media (max-width: 560px) { #mode { display: none; } #hint { font-size: 12px; } }
</style>
</head>
<body>
<!-- content="drawable" (Chrome 155+) and layoutsubtree (earlier builds) both switch on HTML-in-Canvas.
     The surfaces are added by js/surfaces.js from the book list in js/config.js. -->
<canvas id="gl" content="drawable" layoutsubtree aria-label="A candlelit game table with miniatures, dice and two Daggerheart books"></canvas>

<a id="home" class="hud hide-open" href="/"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13 8H3M7 4 3 8l4 4"/></svg>High Sodium Gaming</a>
<p id="hint" class="hud hide-open"><b>Pick up a book</b> to open it · drag to look around</p>
<p id="mode" class="hud hide-open" aria-hidden="true"></p>

<form id="cmd" class="hud" autocomplete="off">
  <label class="sr" for="cmd-in">Dice command, for example /roll duality, /roll 2d6+1 or /attack +2</label>
  <input id="cmd-in" type="text" name="cmd" inputmode="text" enterkeyhint="send" autocapitalize="off" autocorrect="off" spellcheck="false" maxlength="80" placeholder="/roll duality · /attack +2 · /help">
  <button type="submit">Roll</button>
</form>
<div id="log-live" class="sr" role="log" aria-live="polite" aria-label="Dice rolls"></div>

<div id="plate" aria-hidden="true"><div class="box"><h2></h2><p class="sub"></p><p class="meta"></p><span class="pill">Open</span></div></div>

<div id="enter" aria-live="polite">
  <a href="#" target="_blank" rel="noopener"><span></span><svg viewBox="0 0 12 12" width="12" height="12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 8.5l5-5M4.5 3.5h4v4"/></svg></a>
  <button type="button">Back to the table</button>
</div>

<div id="load" role="status"><p>Setting the table</p></div>

<main id="plain">
  <h1>Daggerheart Resources</h1>
  <div id="plain-list"></div>
</main>

<script type="module" src="js/main.js"></script>
</body>
</html>
