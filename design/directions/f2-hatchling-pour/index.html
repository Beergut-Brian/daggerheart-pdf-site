<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>High Sodium Gaming — Daggerheart table resources</title>
<meta name="description" content="Our table's Daggerheart books, searchable on your phone.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="f.css">
<style>
/* F2 hatchling-pour: an empty salt sky; a small hatchling hugs its crystal above the name and pours. */
.hero { --ar: 768 / 1344; --stack-top: 41%; --hw: 190px; --hx: 0px; --hlift: 14px; }
@media (min-width: 700px) {
  .hero { --ar: 1536 / 864; --stack-top: 37%; --hw: 320px; --hx: 300px; --hlift: 26px; }
  .wm .l { display: inline; } .wm .l3 { display: block; }
}
.frame img { animation: lights-on 1.6s var(--ease-out) both; }
@keyframes lights-on { from { filter: brightness(.45) saturate(.7); } to { filter: none; } }
/* scrim only where the type sits */
.scrim { position: absolute; inset: 0; z-index: -1;
  background: radial-gradient(ellipse 80% 22% at 50% 52%, color-mix(in srgb, var(--night) 88%, transparent), transparent 100%); }
@media (min-width: 700px) { .scrim { background: radial-gradient(ellipse 50% 28% at 50% 50%, color-mix(in srgb, var(--night) 82%, transparent), transparent 100%), radial-gradient(ellipse 20% 26% at 50% 28%, color-mix(in srgb, var(--night) 62%, transparent), transparent 100%); } /* quiets the sky's crystal crown so the hatchling is the only character */ }
.stack { top: var(--stack-top); z-index: auto; } /* no stacking context: the hatchling must screen-blend with the sky */
.wm-wrap { position: relative; }
/* the hatchling: cropped from f2-hatchling (source box 485,615 250x245), screen-blended so its black ground vanishes */
.hatch { position: absolute; bottom: calc(100% - var(--hlift)); left: calc(50% + var(--hx) - var(--hw) * .208); width: var(--hw); aspect-ratio: 250 / 245; overflow: hidden;
  mix-blend-mode: screen; pointer-events: none; animation: bob 3.4s ease-in-out infinite alternate, arrive 1.4s var(--ease-out) both;
  -webkit-mask-image: radial-gradient(ellipse 55% 50% at 46% 62%, #000 55%, transparent 100%); mask-image: radial-gradient(ellipse 55% 50% at 46% 62%, #000 55%, transparent 100%); }
.hatch img { position: absolute; max-width: none; width: 409.6%; left: -194%; top: -251%; }
.hatch .pour { left: 20.8%; top: 86%; }
@keyframes bob { from { translate: 0 0; } to { translate: 0 -6px; } }
@keyframes arrive { from { opacity: 0; } to { opacity: 1; } }
</style>
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<main id="main" class="hero">
  <div class="frame" aria-hidden="true">
    <picture>
      <source media="(min-width: 700px)" srcset="../../imagery/F/f2-sky-wide.jpg">
      <img src="../../imagery/F/f2-sky-tall.jpg" alt="" width="768" height="1344">
    </picture>
  </div>
  <div class="scrim" aria-hidden="true"></div>
  <div class="stack">
    <div class="wm-wrap">
      <div class="hatch" aria-hidden="true"><img src="../../imagery/F/f2-hatchling.jpg" alt=""><span class="pour" id="pour"></span></div>
      <h1 class="wm" aria-label="High Sodium Gaming"><span class="l l1">HIGH</span> <span class="l l2">SODIUM</span> <span class="l l3">GAMING</span></h1>
    </div>
    <p class="tag">Rules, close at hand. Salt to taste.</p>
    <a class="pill" href="resources.html" aria-label="Resources — open the book shelf">Resources</a>
  </div>
  <canvas class="salt" id="salt" aria-hidden="true"></canvas>
</main>
<script src="../_shared/salt-engine.js"></script>
<script src="salt-glow.js"></script>
<script>
SaltGlow({ phone: { rate: 170, spread: 10, seconds: 3, prefill: 350, drift: 45, driftSpread: 56, driftOy: -1.1 }, wide: { rate: 220, spread: 14, seconds: 3, prefill: 450, drift: 60, driftSpread: 62, driftOy: -0.85 } });
</script>
</body>
</html>
