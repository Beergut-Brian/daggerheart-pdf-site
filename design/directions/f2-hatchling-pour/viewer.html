<script>
const HITS = [
  ['…HOPE AND FEAR <mark>Hope</mark> and Fear are currencies used by the players and the GM to represent the way fate turns…', 'Ch 1 · Character Creation', 19],
  ['…Before you make an action or reaction roll, you can spend a <mark>Hope</mark> to add the Experience\'s modifier to the roll\'s result…', 'Ch 1 · Character Creation', 21],
  ['…Class <mark>Hope</mark> Feature: Each class has a special move they can make by spending 3 <mark>Hope</mark>…', 'Ch 1 · Class', 28],
  ['…Make a Scene: Spend 3 <mark>Hope</mark> to temporarily Distract a target within Close range…', 'Ch 1 · Class (Bard)', 29],
  ['…Evolution: Spend 3 <mark>Hope</mark> to transform into a Beastform without marking a Stress…', 'Ch 1 · Class (Druid)', 31],
];
// neutral placeholder page: heading bar, grey lines, optional match marks
function pageHTML(marks) {
  let h = '<span class="ph"></span>';
  for (let i = 0; i < 22; i++) {
    const w = i % 7 === 6 ? 58 : 88 + ((i * 37) % 12);
    const m = marks && marks.includes(i);
    h += `<span class="pl${m ? ' hit-mark' : ''}" style="--w:${w}%"></span>`;
    if (i === 10) h += '<span class="ph sub"></span>';
  }
  return h;
}
document.getElementById('bigpage').innerHTML = pageHTML([3, 15]);
document.querySelectorAll('.pscroll .page').forEach(p => p.innerHTML = pageHTML(p.dataset.p === '19' ? [3, 15] : null));
const th = [];
for (let n = 15; n <= 28; n++) {
  const drawn = n <= 24;
  th.push(`<a class="th${n === 19 ? ' cur' : ''}" href="#" aria-label="Page ${n}"${n === 19 ? ' aria-current="page"' : ''}><span class="tp${drawn ? '' : ' blank'}">${drawn ? '<i></i><i></i><i></i><i></i><i></i>' : ''}</span><span class="tn">${n}</span></a>`);
}
document.getElementById('thumbs').innerHTML = th.join('');
const rows = HITS.map(([s, c, p], i) => `<a class="hit${i === 0 ? ' focus' : ''}" href="#" aria-label="Page ${p}, ${c}"><span class="tp"><i></i><i></i><i></i><i></i></span><span><span class="sn">${s}</span><span class="mt">${c} · <b>p. ${p}</b></span></span></a>`).join('');
document.getElementById('hits').innerHTML = rows;
document.getElementById('hits2').innerHTML = rows;
</script>
