<!-- Desktop (>= 900px) -->
<div class="vw">
  <header class="vtop">
    <a class="hsg" href="index.html" aria-label="High Sodium Gaming home"><svg viewBox="0 0 64 64" aria-hidden="true"><use href="#sigil"/></svg>HSG</a>
    <span class="sep" aria-hidden="true"></span>
    <a class="vlink" href="resources.html">← Resources</a>
    <h1 class="vtitle">Daggerheart Core Rulebook</h1>
    <span class="grow"></span>
    <label class="pager">Page <input value="19" inputmode="numeric" aria-label="Go to page"> of 397</label>
    <span class="zoom">
      <button class="ibtn" aria-label="Zoom out"><svg class="ico"><use href="#i-minus"/></svg></button>
      <button class="ibtn" aria-label="Zoom in"><svg class="ico"><use href="#i-plus"/></svg></button>
      <button class="ibtn" aria-label="Fit width"><svg class="ico"><use href="#i-fit"/></svg></button>
    </span>
    <div class="field"><svg class="ico" aria-hidden="true"><use href="#i-search"/></svg><input value="Hope" aria-label="Search Daggerheart Core Rulebook" placeholder="Search the rulebook — try &quot;Hope&quot;"><button class="ibtn" aria-label="Clear search"><svg class="ico"><use href="#i-x"/></svg></button></div>
  </header>
  <div class="vbody">
    <aside class="rail" aria-label="Pages and chapters">
      <div class="tabs" role="tablist"><button class="tab" role="tab" aria-selected="true">Pages</button><button class="tab" role="tab" aria-selected="false">Chapters</button></div>
      <nav class="thumbs" id="thumbs" aria-label="Pages"></nav>

<!-- Phone (< 900px): two screens, each 844px tall -->
<div class="phones">
  <section aria-label="Reading">
    <p class="ph-label">Reading</p>
    <div class="ph">
      <header class="pbar">
        <a class="ibtn" href="resources.html" aria-label="Back to Resources"><svg class="ico"><use href="#i-back"/></svg></a>
        <h1 class="vtitle">Daggerheart Core Rulebook</h1>
        <a class="hsg" href="index.html" aria-label="High Sodium Gaming home"><svg viewBox="0 0 64 64" aria-hidden="true"><use href="#sigil"/></svg></a>
      </header>
      <div class="pscroll"><div class="page" data-p="19" aria-label="Page 19"></div><div class="page" data-p="20" aria-label="Page 20"></div></div>
      <nav class="dock" aria-label="Book controls">
        <button class="ibtn" aria-label="Pages and chapters"><svg class="ico" aria-hidden="true"><use href="#i-pages"/></svg>Pages</button>

  <section aria-label="Search">

      <div class="sheet">
        <div class="grab" aria-hidden="true"></div>
        <div class="sheet-top">
          <div class="field"><svg class="ico" aria-hidden="true"><use href="#i-search"/></svg><input value="Hope" aria-label="Search Daggerheart Core Rulebook"><button class="ibtn" aria-label="Clear search"><svg class="ico"><use href="#i-x"/></svg></button></div>
          <button class="ibtn">Close</button>
        </div>
        <p class="count"><b>148 results</b> for “Hope”</p>
        <ul class="hits" id="hits-p"></ul>
      </div>
    </div>
  </section>
</div>

<script src="crystals.js"></script>
<script>
HSGX.mountDefs();
const HITS = [
  ['…HOPE AND FEAR <mark>Hope</mark> and Fear are currencies used by the players and the GM to represent the way fate turns…', 'Ch 1 · Character Creation', 19],
  ['…Before you make an action or reaction roll, you can spend a <mark>Hope</mark> to add the Experience’s modifier to the roll’s result…', 'Ch 1 · Character Creation', 21],
  ['…Class <mark>Hope</mark> Feature: Each class has a special move they can make by spending 3 <mark>Hope</mark>…', 'Ch 1 · Class', 28],
  ['…Make a Scene: Spend 3 <mark>Hope</mark> to temporarily Distract a target within Close range…', 'Ch 1 · Class (Bard)', 29],
  ['…Evolution: Spend 3 <mark>Hope</mark> to transform into a Beastform without marking a Stress…', 'Ch 1 · Class (Druid)', 31],
];
const rowsHTML = HITS.map(([s, c, p], i) => `<li><a class="hit${i === 0 ? ' on' : ''}" href="#" aria-label="Page ${p}, ${c}"><span class="tp" aria-hidden="true"><i style="top:${30 + i * 9}%"></i></span><span><span class="meta"><span>${c}</span><b>p. ${p}</b></span><p class="sn">${s}</p></span></a></li>`).join('');
document.getElementById('hits-d').innerHTML = rowsHTML;
document.getElementById('hits-p').innerHTML = rowsHTML;
document.getElementById('thumbs').innerHTML = Array.from({ length: 12 }, (_, i) => { const n = 15 + i, cur = n === 19;
  return `<a class="th${cur ? ' cur' : ''}" href="#" aria-label="Page ${n}"${cur ? ' aria-current="page"' : ''}><span class="tp"></span><span class="tn">${n}</span></a>`; }).join('');
// page placeholder: heading bar, two columns of grey lines, sub-heads, two match marks on page 19
const r = HSGX.rng(19);
document.querySelectorAll('.page').forEach((pg) => {
  const col = () => '<div class="col">' + Array.from({ length: 40 }, (_, i) => i % 12 === 5 ? '<span class="l h"></span>' : `<span class="l" style="width:${(78 + r() * 22).toFixed(0)}%"></span>`).join('') + '</div>';
  pg.innerHTML = '<span class="ph"></span>' + col() + col() + (pg.dataset.p === '19' ? '<span class="mk" style="top:24.6%;left:8%;width:13%"></span><span class="mk" style="top:57.2%;left:54%;width:12%"></span>' : '') + `<span class="pn">${pg.dataset.p}</span>`;
});
// signature, quiet form: a little salt crust on the current page thumbnail
function marker() {
  document.querySelectorAll('.th.cur').forEach((th) => {
    th.querySelectorAll('.cur-x').forEach((x) => x.remove());
    const s = HSGX.svgEl(32, 32, 'cur-x'); const tp = th.querySelector('.tp');
    if (document.body.dataset.board === 'cover') { s.style.right = '-14px'; s.style.top = '-14px'; s.innerHTML = HSGX.draw(HSGX.cluster({ seed: 4, cx: 16, cy: 20, R: 9, n: 6, smax: 8, smin: 3, d0: .2, dt: .4 })); }
    else { const n = th.querySelector('.tn'); s.style.left = 'calc(50% + 6px)'; s.style.top = (tp.offsetHeight - 10) + 'px'; s.innerHTML = HSGX.draw(HSGX.cluster({ seed: 8, cx: 10, cy: 24, R: 8, n: 5, smax: 8, smin: 3, spread: [-1.6, -.2], d0: .2, dt: .4 })); }
    th.appendChild(s);
  });
}
HSGX.ready(marker);
</script>
</body>
</html>
