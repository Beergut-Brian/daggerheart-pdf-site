<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>High Sodium Gaming — Daggerheart table resources</title>
<meta name="description" content="Our table's Daggerheart books, searchable on your phone.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="f.css">
<style>
/* F1 wyrm-eclipse: the Wyrm is the whole sky; its heart rises behind the name. */
.hero { --ar: 768 / 1075; --pour-x: 49.9%; --pour-y: 33%; --orb-x: 50%; --orb-y: 50.3%; --stack-top: 55%; }
@media (min-width: 700px) {
  .hero { --ar: 1536 / 864; --pour-x: 70.2%; --pour-y: 52.4%; --orb-x: 49.8%; --orb-y: 47.5%; --stack-top: 55%; }
  .wm .l { display: inline; } .wm .l3 { display: block; }
}
.frame img { animation: lights-on 1.6s var(--ease-out) both; }
.orb { position: absolute; left: var(--orb-x); top: var(--orb-y); width: 70%; aspect-ratio: 1; translate: -50% -50%; border-radius: 50%;
  background: radial-gradient(closest-side, color-mix(in srgb, var(--gold) 34%, transparent), color-mix(in srgb, var(--gold) 10%, transparent) 55%, transparent);
  mix-blend-mode: screen; animation: orb-on 1.6s var(--ease-out) both; }
@media (min-width: 700px) { .orb { width: 34%; } }
@keyframes lights-on { from { filter: brightness(.45) saturate(.7); } to { filter: none; } }
@keyframes orb-on { from { opacity: 0; scale: .6; } to { opacity: 1; scale: 1; } }
/* scrim only where the type sits: the lower band */
.scrim { position: absolute; inset: 0; z-index: -1;
  background: linear-gradient(180deg, transparent 50%, color-mix(in srgb, var(--night) 62%, transparent) 64%, color-mix(in srgb, var(--night) 80%, transparent) 100%); }
@media (min-width: 700px) {
  .scrim { background: radial-gradient(ellipse 52% 30% at 50% 72%, color-mix(in srgb, var(--night) 72%, transparent), transparent 100%); }
}
.stack { top: var(--stack-top); }
</style>
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<main id="main" class="hero">
  <div class="frame" aria-hidden="true">
    <picture>
      <source media="(min-width: 700px)" srcset="../../imagery/F/f1-wyrm-wide.jpg">
      <img src="../../imagery/F/f1-wyrm-tall.jpg" alt="" width="768" height="1075">
    </picture>
    <span class="orb"></span>
    <span class="pour" id="pour"></span>
  </div>
  <div class="scrim" aria-hidden="true"></div>
  <div class="stack">
    <h1 class="wm" aria-label="High Sodium Gaming"><span class="l l1">HIGH</span> <span class="l l2">SODIUM</span> <span class="l l3">GAMING</span></h1>
    <p class="tag">Rules, close at hand. Salt to taste.</p>
    <a class="pill" href="resources.html" aria-label="Resources — open the book shelf">Resources</a>
  </div>
  <canvas class="salt" id="salt" aria-hidden="true"></canvas>
</main>
<script src="../_shared/salt-engine.js"></script>
<script src="salt-glow.js"></script>
<script>
SaltGlow({ phone: { rate: 150, spread: 12, seconds: 2.8, prefill: 450, drift: 45, driftSpread: 56, driftOy: -1.1 }, wide: { rate: 170, spread: 18, seconds: 2.8, prefill: 450, drift: 60, driftSpread: 62, driftOy: -0.85 } });
</script>
</body>
</html>
